name: DNOS CI

# Build the canon end-to-end on every push / PR:
#   1. train + validate  (Python <-> assembly Q8.8 agreement, exits non-zero on divergence)
#   2. build             (assemble dnos.asm, patch weights, pad image)
#   3. boot test         (headless QEMU: reach PM/VESA without a triple fault)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 python3-numpy

      - name: Train + validate (Python <-> assembly agreement)
        run: python3 tools/train.py

      - name: Context-generalization eval (held-out random histories)
        run: python3 tools/context_eval.py --min-accuracy 95

      - name: Build image (assemble + patch weights + pad)
        run: python3 tools/build.py

      - name: Headless boot test (PM + VESA, no triple fault)
        run: python3 tools/boot_test.py --seconds 8

      - name: Interactive differential test (law vs metal over QMP keystrokes)
        run: python3 tools/interactive_test.py

      - name: Weight-integrity test (pristine validates, corrupted is rejected)
        run: python3 tools/integrity_test.py

      - name: Deterministic-loop test (step_count <= tick_count, burst drain)
        run: python3 tools/tick_test.py

      - name: Swarm replication test (S0 - N nodes, one log, one state)
        run: python3 tools/swarm_test.py --nodes 3

      - name: Serial differential test (S1 - keyboard and wire are one interface)
        run: python3 tools/serial_test.py

      - name: Rust determinism layers (IAL + NDAL)
        run: |
          cargo test --manifest-path ial/Cargo.toml
          cargo test --manifest-path ndal/Cargo.toml

      - name: Upload boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshot
          path: boot_screenshot.png
          if-no-files-found: ignore
