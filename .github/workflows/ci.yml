name: DNOS CI

# Build the canon end-to-end on every push / PR:
#   1. train + validate  (Python <-> assembly Q8.8 agreement, exits non-zero on divergence)
#   2. build             (assemble dnos.asm, patch weights, pad image)
#   3. boot test         (headless QEMU: reach PM/VESA without a triple fault)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 python3-numpy

      - name: Train + validate (Python <-> assembly agreement)
        run: python3 tools/train.py

      - name: Context-generalization eval (held-out random histories)
        run: python3 tools/context_eval.py --min-accuracy 95

      - name: Privacy leakage eval (M0)
        # Measures output leakage of private history; adds no noise. Non-gating
        # by default (the tool exits 0 unless --max-history-bits is set), but a
        # crash / self-check abort DOES fail the job — we want that surfaced.
        # To turn it into a regression gate once a budget is chosen, add
        # `--max-history-bits <bits>`; it will then fail the build on breach.
        run: python3 tools/leakage_eval.py --json leakage.json --table leakage.tbl

      - name: Build image (assemble + patch weights + pad)
        run: python3 tools/build.py

      - name: Headless boot test (PM + VESA, no triple fault)
        run: python3 tools/boot_test.py --seconds 8

      - name: Interactive differential test (law vs metal over QMP keystrokes)
        run: python3 tools/interactive_test.py

      - name: Upload boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshot
          path: boot_screenshot.png
          if-no-files-found: ignore

      - name: Upload leakage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakage-report
          path: |
            leakage.json
            leakage.tbl
          if-no-files-found: ignore
