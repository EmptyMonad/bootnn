name: DNOS CI

# The v5-era gauntlet. The canonical law (weights_ssm.bin, committed)
# is verified by CRC on every push and by FULL TRAINING REPLAY in the
# scheduled/manual `replay` workflow - the S2 principle applied to our
# own CI: pin the artifact, verify cheaply always, replay-verify
# periodically. Every behavioral gate below runs on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned canonical v5 law (whole-file CRC32). Changing the law means
  # changing this constant in the same commit - deliberately loud.
  CANONICAL_V5_CRC: "0x93e6386f"

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 qemu-system-misc python3-numpy
          rustup target add riscv32imac-unknown-none-elf

      - name: Verify canonical v5 blob (CRC pin)
        run: |
          python3 - <<'EOF'
          import os, sys
          from zlib import crc32
          from pathlib import Path
          got = crc32(Path("weights_ssm.bin").read_bytes()) & 0xFFFFFFFF
          want = int(os.environ["CANONICAL_V5_CRC"], 0)
          print(f"blob crc {got:#010x}, pinned {want:#010x}")
          sys.exit(0 if got == want else 1)
          EOF

      - name: Ternary format gate (v4a/v4b/v5 - bit-exact, self-rejecting)
        run: python3 tools/ternary_format_test.py

      - name: Held-out generalization gate (v5 law, wide alphabet)
        run: python3 tools/context_eval.py --weights weights_ssm.bin --min-accuracy 95

      - name: Build image (assemble + patch committed blob + pad)
        run: python3 tools/build.py

      - name: Headless boot test (PM + VESA, no triple fault)
        run: python3 tools/boot_test.py --seconds 8

      - name: Interactive differential test (law vs metal, stateful)
        run: python3 tools/interactive_test.py

      - name: Weight-integrity test (payload CRC, corruption rejected)
        run: python3 tools/integrity_test.py

      - name: Deterministic-loop test (step_count <= tick_count, burst drain)
        run: python3 tools/tick_test.py

      - name: Swarm replication test (S0 - one log, one state, h included)
        run: python3 tools/swarm_test.py --nodes 3

      - name: Serial differential test (S1 v1 framing, keyboard == wire)
        run: python3 tools/serial_test.py

      - name: Client record/replay test (the log IS the session)
        run: python3 tools/client_test.py

      - name: Wire-frame differential (Rust encoder == Python authority)
        run: python3 tools/frame_test.py

      - name: Ledger test (S2 - mint on verified replay)
        run: python3 tools/ledger_test.py

      - name: Authorship test (persistent Merkle-Lamport identity, reward identity-blind)
        run: python3 tools/authorship_test.py

      - name: Forest structure gate (S3 - hard routing, bit-exact views)
        run: python3 tools/s3_forest.py --smoke

      - name: Structural claim gate (create_leaf - architecture is a fold over the log)
        run: python3 tools/structure_test.py

      - name: Portability gate (S2 - substrate coverage mints once per pair)
        run: python3 tools/portability_test.py

      - name: Intent compiler gate (config is law, conversation is ephemeral)
        run: python3 tools/intent_test.py

      - name: Rust determinism layers (IAL + NDAL)
        run: |
          cargo test --manifest-path ial/Cargo.toml
          cargo test --manifest-path ndal/Cargo.toml

      - name: Upload boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshot
          path: boot_screenshot.png
          if-no-files-found: ignore
